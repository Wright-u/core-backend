name: CI Pipeline

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    schedule:
        - cron: '30 0 * * 6'

jobs:
    analyze:
        name: Build and Analyze
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@v2

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: csharp
                  queries: security-extended

            - name: Restore dependencies
              run: dotnet restore Wright.slnx

            - name: Check code format
              run: dotnet format Wright.slnx --verify-no-changes

            - name: Build Solution
              run: dotnet build Wright.slnx --configuration Release --no-restore

            - name: Run Tests
              run: dotnet test Wright.slnx --configuration Release --no-build --verbosity normal

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3